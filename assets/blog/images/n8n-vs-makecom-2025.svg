    <text x="8" y="12" font-family="system-ui" font-size="9" fill="#6d4afa" text-anchor="middle">✓</text>
    <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#4a5577">Intuicyjny interfejs graficzny</text>
  </g>
  <g transform="translate(460, 220)">
    <circle cx="8" cy="8" r="6" fill="#f5f2ff"/>
    <text x="8" y="12" font-family="system-ui" font-size="9" fill="#6d4afa" text-anchor="middle">✓</text>
    <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#4a5577">1000+ gotowych modułów</text>
  </g>
  <g transform="translate(460, 250)">
    <circle cx="8" cy="8" r="6" fill="#f5f2ff"/>
    <text x="8" y="12" font-family="system-ui" font-size="9" fill="#6d4afa" text-anchor="middle">✓</text>
    <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#4a5577">Szybki start bez VPS</text>
  </g>
  <g transform="translate(460, 280)">
    <circle cx="8" cy="8" r="6" fill="#f5f2ff"/>
    <text x="8" y="12" font-family="system-ui" font-size="9" fill="#6d4afa" text-anchor="middle">✓</text>
    <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#4a5577">Wbudowane narzędzia AI</text>
  </g>
  <g transform="translate(460, 310)">
    <circle cx="8" cy="8" r="6" fill="#fff8e1"/>
    <text x="8" y="12" font-family="system-ui" font-size="9" fill="#f59e0b" text-anchor="middle">!</text>
    <text x="24" y="12" font-family="system-ui, sans-serif" font-size="13" fill="#4a5577">Koszty rosną z ilością operacji</text>
