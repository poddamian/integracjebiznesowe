  <text x="400" y="218" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="800" fill="#141623" text-anchor="middle">VS</text>

  <!-- Bottom labels -->
  <rect x="60" y="380" width="120" height="26" rx="13" fill="#fef0f3"/>
  <text x="120" y="398" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ea4b71" text-anchor="middle">Dla zaawansowanych</text>

  <rect x="220" y="380" width="120" height="26" rx="13" fill="#e8f5e9"/>
  <text x="280" y="398" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#2e7d32" text-anchor="middle">Self-hosted FREE</text>

  <rect x="460" y="380" width="120" height="26" rx="13" fill="#f5f2ff"/>
  <text x="520" y="398" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#6d4afa" text-anchor="middle">Dla startujących</text>

  <rect x="600" y="380" width="140" height="26" rx="13" fill="#fff3e0"/>
  <text x="670" y="398" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e65100" text-anchor="middle">od 9 USD/mies.</text>

  <!-- Integracje Biznesowe watermark -->
  <text x="400" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#8896b8" text-anchor="middle">integracjebiznesowe.pl</text>
</svg>
